name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://lastresort:lastresort_ci@127.0.0.1:5432/lastresort_test_ci
      TEST_DATABASE_URL: postgresql://lastresort:lastresort_ci@127.0.0.1:5432/lastresort_test_ci
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lastresort
          POSTGRES_PASSWORD: lastresort_ci
          POSTGRES_DB: lastresort_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lastresort -d lastresort_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:http
