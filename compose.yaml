services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: lastresort
      POSTGRES_PASSWORD: lastresort_local_demo
      POSTGRES_DB: lastresort_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lastresort_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastresort -d lastresort_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  lastresort_demo_data:
